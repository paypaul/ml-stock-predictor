name: Enterprise Equity Analytics CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass1234
          POSTGRES_DB: stock_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn yfinance psycopg2-binary pytest streamlit plotly

      - name: Verify Relational Schema & Analytical Views
        env:
          PGPASSWORD: pass1234
        run: |
          psql -h localhost -U postgres -d stock_analytics -f schema.sql

      - name: Execute Unit Test Suite
        run: |
          pytest test_pipeline.py -v
